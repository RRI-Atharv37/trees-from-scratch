[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treesfs"
version = "0.2.0"
description = "Decision trees (CART) from scratch in NumPy: O(n)-after-sort split search, flat-array trees, text/DOT export and a depth-vs-accuracy study."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atharv Dewangan" }]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "joblib>=1.3",
    # scikit-learn is a runtime dependency ONLY because the California downloader needs it
    # (lazy import inside data.download_california). Models never import it.
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/treesfs"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
# ruff >= 0.15 also formats code blocks inside Markdown; docs/DESIGN.md is hand-laid-out.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
filterwarnings = [
    # forests with only a few trees legitimately leave some rows never out-of-bag
    "ignore:.*never out-of-bag.*:UserWarning",
]
markers = [
    "slow: heavier tests (real Adult data, big trees); run with `pytest -m slow`",
]

[tool.ruff.lint.per-file-ignores]
# Verbatim UCI Adult rows are long on purpose.
"tests/conftest.py" = ["E501"]
